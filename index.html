<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Generator grafik Radio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f6;--fg:#15151a;--card:#fff;--bd:#d8d8de}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101014;--fg:#eee;--card:#1b1b22;--bd:#33333d}}
:root[data-theme="dark"]{--bg:#101014;--fg:#eee;--card:#1b1b22;--bd:#33333d}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Titillium Web',Arial,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:20px;padding:20px;max-width:1100px;margin:auto}
.panel{flex:1 1 300px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;align-self:flex-start}
.view{flex:1 1 380px;min-width:0}
canvas{background:repeating-conic-gradient(#8885 0 25%,#0000 0 50%) 0 0/24px 24px;width:100%;max-width:540px;height:auto;border-radius:8px;display:block;margin:auto}
label{font-size:13px;opacity:.75}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:130px;resize:vertical}
button{padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
button.main{background:#d90000;color:#fff;border:0;font-weight:bold}
.row{display:flex;gap:10px}.row>*{flex:1}
small{opacity:.65;font-size:12px}
</style></head><body>
<div class="wrap">
 <div class="panel">
  <div class="row">
   <div><label>Nick / kierowca</label><input id="nick" value="Leclerc"></div>
   <div style="flex:0 0 80px"><label>Numer</label><input id="num" value="16"></div>
  </div>
  <div><label>Zespół (logo dodaje się samo)</label><select id="team"></select></div>
  <div><label>Wiadomości radiowe (jedna linia = jedna wiadomość)</label>
  <textarea id="msgs">Is there a leakage?
A leakage of what?
I have the seat full of water! Like, full of water!
Must be the water
Let's add that to the words of wisdom</textarea></div>
  <div><label>Tempo animacji: <span id="stepv">0.9</span> s na wiadomość</label>
  <input type="range" id="step" min="0.4" max="2" step="0.1" value="0.9"></div>
  <button class="main" id="play">▶ Odtwórz animację</button>
  <button class="main" id="mov">Pobierz (.mov, bez tła)</button>
  <small id="info">Zapisuje film .mov z przezroczystym tłem (kodek PNG z kanałem alfa). Renderuje się szybciej niż w czasie rzeczywistym.</small>

const TEAMS={"Ferrari":"#e10600","Red Bull":"#3671c6","Mercedes":"#27f4d2","McLaren":"#ff8000","Aston Martin":"#229971","Alpine":"#ff87bc","Williams":"#64c4ff","Haas":"#b6babd","Racing Bulls":"#6692ff","Audi":"#f50537","Cadillac":"#c0c0c0"};
const F="'Titillium Web',Arial,sans-serif";
const $=id=>document.getElementById(id),cv=$("c"),ctx=cv.getContext("2d");
let raf=0,total=5;const imgs={};
const teamSel=$("team");Object.keys(TEAMS).forEach(t=>{teamSel.add(new Option(t,t));const i=new Image();i.onload=()=>draw();i.src=LOGOS[t];imgs[t]=i});
const clamp=x=>Math.max(0,Math.min(1,x)),e3=x=>1-Math.pow(1-x,3);
function wrap(t,w){const out=[];let l="";for(const x of t.split(" ")){const n=l?l+" "+x:x;if(ctx.measureText(n).width>w&&l){out.push(l);l=x}else l=n}if(l)out.push(l);return out}
function reveal(x,y,w,h,p,fn){if(p<=0)return;ctx.save();ctx.beginPath();ctx.rect(x,y,w*p+(p>=1?200:0),h);ctx.clip();ctx.translate(-(1-p)*70,0);fn();ctx.restore()}
function draw(T=1e9){
 const W=1080,H=1350,team=teamSel.value,col=TEAMS[team];
 const r=(s,d)=>clamp((T-s)/d);
 ctx.clearRect(0,0,W,H);ctx.textBaseline="alphabetic";ctx.textAlign="left";
 const px=130,pw=820,py=200,pad=50,iw=pw-pad*2,step=+$("step").value;
 const msgs=$("msgs").value.split("\n").map(s=>s.trim()).filter(Boolean);
 ctx.font="700 42px "+F;
 const blocks=msgs.map(m=>wrap('"'+m.toUpperCase()+'"',iw-20));
 const LH=56,GAP=34;let qh=0;blocks.forEach(b=>qh+=b.length*LH+GAP);
 const ph=500+qh+10;total=1.2+msgs.length*step+1.8;
 // panel
 const pp=e3(r(0,.5));
 const blk=false;
 const bk=(x,y,w,h)=>{ctx.fillStyle="rgba(12,12,16,.75)";ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x,y,8,h)};
 if(pp>0&&!blk){ctx.fillStyle="rgba(22,22,28,.8)";ctx.fillRect(px,py,pw*pp,ph);ctx.fillStyle=col;ctx.fillRect(px,py,pw*pp,9)}
 // header
 let fs=132;const nick=$("nick").value.toUpperCase();
 ctx.font="italic 700 "+fs+"px "+F;while(ctx.measureText(nick).width>iw&&fs>40){fs-=4;ctx.font="italic 700 "+fs+"px "+F}
 reveal(px+pad,py+pad-30,iw,fs*1.3,e3(r(.3,.5)),()=>{ctx.font="italic 700 "+fs+"px "+F;if(blk)bk(px+pad-20,py+pad-5,ctx.measureText(nick).width+40,130);ctx.fillStyle=col;ctx.fillText(nick,px+pad,py+pad+105)});
 reveal(px+pad,py+pad+110,iw,150,e3(r(.45,.5)),()=>{ctx.font="italic 700 132px "+F;if(blk)bk(px+pad-20,py+pad+130,ctx.measureText("RADIO").width+40,125);ctx.fillStyle="#fff";ctx.fillText("RADIO",px+pad,py+pad+235)});
 reveal(px+pad,py+pad+250,330,190,e3(r(.6,.5)),()=>{ctx.font="italic 900 200px "+F;if(blk)bk(px+pad-20,py+pad+255,ctx.measureText($("num").value).width+40,175);ctx.fillStyle=col;ctx.fillText($("num").value,px+pad,py+pad+415)});
 const L=imgs[team],ls=150,lx=px+pw-pad-ls-10,ly=py+pad+265,lp=e3(r(.75,.5));
 if(L.complete&&L.naturalWidth&&lp>0){const k=Math.min(ls/L.naturalWidth,ls/L.naturalHeight)*(.6+.4*lp),w=L.naturalWidth*k,h=L.naturalHeight*k;ctx.save();ctx.globalAlpha=lp;ctx.drawImage(L,lx+(ls-w)/2,ly+(ls-h)/2,w,h);ctx.restore()}
 // quotes
 ctx.textAlign="center";ctx.font="700 42px "+F;let y=py+500+LH*0.78;
 blocks.forEach((b,i)=>{
  const top=y-LH*0.78,h=b.length*LH,u=r(1.2+i*step,.5),x0=px+pad;
  const a=e3(clamp(u*2)),bb=e3(clamp(u*2-1));
  if(u>0){
   ctx.save();ctx.beginPath();ctx.rect(x0-20,top,u>=1?iw+40:iw*bb+20,h);ctx.clip();
   if(blk){const mw=Math.max(...b.map(l=>ctx.measureText(l).width))+50;bk(px+pw/2-mw/2,top,mw,h)}ctx.fillStyle=i%2?"#fff":col;b.forEach((l,j)=>ctx.fillText(l,px+pw/2,y+j*LH));ctx.restore();
   if(u<1){ctx.fillStyle=col;ctx.fillRect(x0+iw*bb,top+4,iw*(a-bb),h-8)}
  }
  y+=h+GAP;
 });
}
function play(done){cancelAnimationFrame(raf);const t0=performance.now();
 const loop=()=>{const t=(performance.now()-t0)/1000;if(t<total){draw(t);raf=requestAnimationFrame(loop)}else{draw();done&&done()}};loop()}
const S=()=>draw();
["nick","num","msgs"].forEach(i=>$(i).addEventListener("input",S));
teamSel.addEventListener("change",S);
$("step").addEventListener("input",()=>{$("stepv").textContent=$("step").value;S()});
$("play").onclick=()=>play();
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function makeMov(fr,w,h,fps){
 const u32=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255],u16=n=>[(n>>8)&255,n&255],str=s=>[...s].map(c=>c.charCodeAt(0)),z=k=>new Array(k).fill(0);
 const box=(t,...p)=>{const b=p.flat();return [...u32(b.length+8),...str(t),...b]};
 const n=fr.length,tot=fr.reduce((a,b)=>a+b.byteLength,0),mat=[0x10000,0,0,0,0x10000,0,0,0,0x40000000].flatMap(u32);
 const ftyp=box("ftyp",str("qt  "),u32(0x20050300),str("qt  "));
 const mvhd=box("mvhd",z(4),u32(0),u32(0),u32(fps),u32(n),u32(0x10000),u16(0x100),z(10),mat,z(24),u32(2));
 const tkhd=box("tkhd",[0,0,0,3],u32(0),u32(0),u32(1),z(4),u32(n),z(8),z(2),z(2),z(2),z(2),mat,u32(w<<16),u32(h<<16));
 const mdhd=box("mdhd",z(4),u32(0),u32(0),u32(fps),u32(n),u16(0x55c4),u16(0));
 const hdlr=box("hdlr",z(4),z(4),str("vide"),z(12),str("VideoHandler"),[0]);
 const vmhd=box("vmhd",[0,0,0,1],z(8));
 const dinf=box("dinf",box("dref",z(4),u32(1),box("url ",[0,0,0,1])));
 const nm=str("PNG"),cname=[nm.length,...nm,...z(31-nm.length)];
 const stsd=box("stsd",z(4),u32(1),box("png ",z(6),u16(1),u16(0),u16(0),u32(0),u32(0),u32(0),u16(w),u16(h),u32(0x480000),u32(0x480000),u32(0),u16(1),cname,u16(32),[255,255]));
 const stts=box("stts",z(4),u32(1),u32(n),u32(1)),stsc=box("stsc",z(4),u32(1),u32(1),u32(n),u32(1));
 const stsz=box("stsz",z(4),u32(0),u32(n),fr.flatMap(f=>u32(f.byteLength))),stco=box("stco",z(4),u32(1),u32(ftyp.length+8));
 const stbl=box("stbl",stsd,stts,stsc,stsz,stco);
 const moov=box("moov",mvhd,box("trak",tkhd,box("mdia",mdhd,hdlr,box("minf",vmhd,dinf,stbl))));
 return new Blob([new Uint8Array(ftyp),new Uint8Array([...u32(tot+8),...str("mdat")]),...fr,new Uint8Array(moov)],{type:"video/quicktime"});
}

$("mov").onclick=async()=>{
 cancelAnimationFrame(raf);draw();
 const fps=30,n=Math.ceil(total*fps),fr=[];
 for(let i=0;i<=n;i++){draw(i/fps);const b=await new Promise(r=>cv.toBlob(r));fr.push(await b.arrayBuffer());$("info").textContent="Renderowanie: "+i+"/"+n;await new Promise(r=>setTimeout(r))}
 draw();
 save(makeMov(fr,cv.width,cv.height,fps),($("nick").value||"radio")+"-bez-tla.mov");$("info").textContent="Zapisano film z przezroczystym tłem (.mov).";
};
draw();
if(document.fonts)Promise.all([document.fonts.load("italic 700 40px 'Titillium Web'"),document.fonts.load("italic 900 40px 'Titillium Web'"),document.fonts.load("700 40px 'Titillium Web'")]).then(S).catch(()=>{});
</script></body></html>
